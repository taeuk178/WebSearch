# gemma-server SSH 하드닝 (공개키 전용)
# 설치: sudo cp config/sshd_config.d/gemma.conf /etc/ssh/sshd_config.d/gemma.conf
#       sudo launchctl kickstart -k system/com.openssh.sshd
# ⚠️ 적용 전, 사용하는 모든 기기에서 키(비밀번호 없이) 로그인이 되는지 반드시 확인할 것.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
AllowUsers taeuk
